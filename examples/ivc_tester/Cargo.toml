[package]
name = "ivc_tester"
version = "0.1.0"
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
aarch64-dyn = ["dep:axplat-aarch64-dyn"]

[dependencies]
axstd = { workspace = true, features = ["multitask", "paging", "alloc", "myplat"] }
axhvc = { git = "https://github.com/arceos-hypervisor/axhvc.git" }
axplat-aarch64-dyn = { git = "https://github.com/arceos-hypervisor/axplat-aarch64-dyn.git", features = ["smp", "irq"], optional = true }
