[package]
description = "A no_std MJPEG decoder with RGBA output support"
edition = "2021"
name = "mjpeg-decoder"
version = "0.1.0"

[dependencies]
# 只使用core库，支持no_std
libm = "0.2"
log = {version = "0.4", default-features = false}
# 使用zune-jpeg进行JPEG解码，不启用std feature
zune-jpeg = {version = "0.4.13", default-features = false}

# 测试时使用的依赖
[dev-dependencies]
image = "0.24"
jpeg-decoder = "0.3"
jpeg-encoder = "0.5"

[features]
default = []
test = []

[lib]
name = "mjpeg_decoder"
path = "src/lib.rs"

[[example]]
name = "test_zune_jpeg"
path = "examples/test_zune_jpeg.rs"
